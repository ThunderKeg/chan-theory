<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta id="theme-color" name="theme-color" content="#f3eee4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="缠论 108 课" />
    <meta
      name="description"
      content="《教你炒股票》阿娇版静态阅读站：更清晰的目录、术语、定理与批注排版。"
    />
    <title>教你炒股票 · 阿娇版</title>
    <script>
      (() => {
        const theme = localStorage.getItem("chan-reader-theme") || "light";
        const scale = localStorage.getItem("chan-reader-scale") || "100";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.setProperty("--reader-scale", `${scale}%`);
        document.querySelector("#theme-color").content = theme === "dark" ? "#151914" : "#f3eee4";
      })();
    </script>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
    <link rel="stylesheet" href="assets/styles.css?v=20260816-windows-titlebar" />
  </head>
  <body>
    <a class="skip-link" href="#chapter-content">跳到正文</a>
    <div class="reading-progress" aria-hidden="true">
      <span id="reading-progress-bar"></span>
    </div>

    <header class="topbar">
      <div class="topbar__brand">
        <button
          class="icon-button topbar__menu"
          id="toc-toggle"
          type="button"
          aria-controls="book-sidebar"
          aria-expanded="false"
          aria-label="打开目录"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <a class="wordmark" href="./" aria-label="返回本书首页">
          <span class="wordmark__seal">缠</span>
          <span>
            <strong>教你炒股票</strong>
            <small>阿娇版 · 108 课</small>
          </span>
        </a>
      </div>

      <div class="topbar__chapter" id="topbar-chapter" aria-live="polite">
        正在载入章节…
      </div>

      <div class="reader-tools" aria-label="阅读设置">
        <button class="install-button" id="install-app" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v11M7.5 9.5 12 14l4.5-4.5M5 17v3h14v-3" />
          </svg>
          <span>安装</span>
        </button>
        <button
          class="keep-awake-button"
          id="keep-awake"
          type="button"
          aria-label="切换阅读时屏幕常亮"
          aria-pressed="true"
          data-active="false"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="6" width="16" height="11" rx="2" />
            <path d="M9 21h6M12 17v4M8 2h8M12 2v2" />
          </svg>
          <span>常亮</span>
        </button>
        <div class="font-controls" aria-label="字号">
          <button type="button" id="font-decrease" aria-label="减小字号">A−</button>
          <button type="button" id="font-reset" aria-label="恢复默认字号">100%</button>
          <button type="button" id="font-increase" aria-label="增大字号">A＋</button>
        </div>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="切换深浅配色">
          <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
          <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 15.4A8.5 8.5 0 0 1 8.6 4 8.5 8.5 0 1 0 20 15.4Z" />
          </svg>
        </button>
      </div>
    </header>

    <div class="site-shell">
      <aside class="book-sidebar" id="book-sidebar" aria-label="全书目录">
        <div class="sidebar__intro">
          <span class="sample-pill">全书校订完成</span>
          <h1>缠论 108 课</h1>
          <p>从 PDF 到可检索、可定位、适合长时间阅读的静态书站。</p>
          <button class="resume-reading" id="resume-reading" type="button" hidden>
            <span>继续上次阅读</span>
            <strong id="resume-reading-label"></strong>
          </button>
        </div>

        <label class="toc-search" for="toc-search-input">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="6" />
            <path d="m16 16 4 4" />
          </svg>
          <input id="toc-search-input" type="search" placeholder="搜索课程标题" autocomplete="off" />
        </label>

        <div class="toc-meta">
          <span>全书目录</span>
          <span id="toc-available-count"><i class="status-dot"></i> 正在统计开放章节</span>
        </div>
        <nav class="chapter-list" id="chapter-list" aria-label="课程列表"></nav>
      </aside>
      <button class="sidebar-scrim" id="sidebar-scrim" type="button" aria-label="关闭目录"></button>

      <main class="reader-main">
        <div id="chapter-error" class="chapter-error" role="alert" hidden></div>
        <article class="chapter" id="chapter-content" tabindex="-1" aria-busy="true">
          <div class="chapter-loading">
            <span></span><span></span><span></span>
            <p>正在整理书页…</p>
          </div>
        </article>
        <nav class="chapter-pager" aria-label="章节翻页">
          <button type="button" id="previous-chapter" disabled>
            <span>上一课</span>
            <strong>正在载入</strong>
          </button>
          <div class="chapter-pager__mark" id="chapter-pager-mark" aria-hidden="true">序</div>
          <button type="button" id="next-chapter" disabled>
            <span>下一课</span>
            <strong>正在载入</strong>
          </button>
        </nav>
        <footer class="site-footer">
          <p>内容依据《教你炒股票--阿娇版》PDF 逐章整理与复核。</p>
          <p>仅合并断行、统一全半角与标点；原文、原书批注、编辑导读分别标示。</p>
        </footer>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="update-banner" id="update-banner" role="status" aria-live="polite" hidden>
      <div>
        <strong>发现新版本</strong>
        <span>更新已准备好，刷新后生效，阅读进度不会丢失。</span>
      </div>
      <button class="update-banner__primary" id="update-now" type="button">立即更新</button>
      <button class="update-banner__dismiss" id="update-dismiss" type="button" aria-label="暂时关闭更新提示">稍后</button>
    </div>

    <dialog class="image-viewer" id="image-viewer" aria-labelledby="image-viewer-caption">
      <div class="image-viewer__panel">
        <div class="image-viewer__toolbar">
          <p id="image-viewer-caption"></p>
          <div class="image-viewer__actions" aria-label="图片缩放控制">
            <button type="button" id="image-zoom-out" aria-label="缩小图片">−</button>
            <output id="image-zoom-level" aria-live="polite">100%</output>
            <button type="button" id="image-zoom-in" aria-label="放大图片">＋</button>
            <button type="button" id="image-zoom-reset">复位</button>
            <button type="button" id="image-viewer-close" aria-label="关闭图片查看">关闭</button>
          </div>
        </div>
        <div class="image-viewer__stage" id="image-viewer-stage">
          <img id="image-viewer-image" alt="" draggable="false" />
        </div>
        <p class="image-viewer__hint">双击或双指缩放，放大后拖动查看</p>
      </div>
    </dialog>

    <dialog class="install-guide" id="install-guide" aria-labelledby="install-guide-title">
      <div class="install-guide__card">
        <span class="wordmark__seal" aria-hidden="true">缠</span>
        <div>
          <h2 id="install-guide-title">添加到桌面</h2>
          <p>在 Safari 底部点“分享”，再选择“添加到主屏幕”。安装后可像 App 一样打开，并离线阅读已访问的章节。</p>
        </div>
        <button type="button" id="install-guide-close">知道了</button>
      </div>
    </dialog>
    <noscript>请启用 JavaScript 以载入章节数据和目录。</noscript>
    <script type="module" src="assets/app.js?v=20260816-windows-titlebar"></script>
  </body>
</html>
